[project]
name = "boilerplate"
version = "0.1.0"
description = "Casca interview boilerplate"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "pydantic-settings",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]
