[project]
name = "boilerplate"
version = "0.1.0"
description = "Casca interview boilerplate"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.31.0",
  "fastapi[standard]",
  "pydantic-settings",
  "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
  "pyright>=1.1.409",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]
